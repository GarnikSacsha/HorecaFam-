services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: horeca_test
      POSTGRES_USER: horeca
      POSTGRES_PASSWORD: horeca_test_password
    ports:
      - "54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horeca -d horeca_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
